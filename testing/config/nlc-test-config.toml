# NASA Land Coupler Test Configuration
#
# This file defines the regression tests for the NASA-Land-Coupler-Data repository.
#

[[tests]]
# Coupled LIS and WRF-Hydro simulation
name = "LISWRFHYDRO"
mpi = true
processors = 4
components = [ "LIS", "WRFHYDRO" ]
input = [ "https://github.com/esmf-org/NASA-Land-Coupler-Data/releases/download/v0.1.0/nlc_testdata_001.tar.gz" ]
[[tests.checks]]
type = "nccmp"
file = "LIS_OUTPUT/lw_pf/SURFACEMODEL/200501/LIS_HIST_200501020000.d01.nc"
args = "--Tolerance=1e-1"

[[tests]]
# Coupled LIS and ParFlow simulation
name = "LISPARFLOW"
mpi = true
processors = 4
components = [ "LIS", "PARFLOW" ]
[[tests.input]]
file = "https://github.com/esmf-org/NASA-Land-Coupler-Data/releases/download/v0.1.0/nlc_testdata_002.tar.gz"
[[tests.checks]]
type = "nccmp"
file = "LIS_OUTPUT/lw_pf/SURFACEMODEL/200501/LIS_HIST_200501020000.d01.nc"
args = [ "--Tolerance=1e-1", "--variable=SoilMoist_tavg,SoilTemp_tavg,GWS_tavg"]

[[tests]]
# Standalone MPAS Atmosphere
name = "MPAS_ATM"
mpi = true
processors = 4
input = [ "https://github.com/esmf-org/NASA-Land-Coupler-Data/releases/download/v0.1.0/nlc_testdata_003.tar.gz" ]
components = [ "MPAS_ATM" ]
[[tests.checks]]
type = "nccmp"
file = "history.2015-07-11_14.00.00.nc"
args = [ "--tolerance=1e1", "--variable=u10,v10,rainc,q2,t2m,smois" ]
[[tests.checks]]
type = "nccmp"
file = "history.2015-07-11_14.00.00.nc"
args = [ "--Tolerance=1e1", "--variable=pressure" ]
